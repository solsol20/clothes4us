<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Clothes4Us</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body data-page="login">

  <header class="top-header">
    <div class="logo-section">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
        <img src="img/clothes4uslogosinfondo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Clothes4Us</h1>
      </a>
    </div>
  </header>

  <main class="aero-wrapper auth-wrapper">
    <div class="aero-panel auth-panel">
      <h3>Iniciar Sesión</h3>
      <p class="auth-sub">Entrá para comprar, vender e intercambiar ropa.</p>

      <div id="alerta" class="auth-alert" role="alert" aria-live="assertive"></div>

      <form id="form-login" novalidate>
        <label for="identificador">Usuario, correo o teléfono:</label>
        <input type="text" id="identificador" autocomplete="username" autocapitalize="none"
               autocorrect="off" spellcheck="false" required placeholder="Tu usuario, correo o teléfono">

        <label for="password">Contraseña:</label>
        <div class="pw-wrap">
          <input type="password" id="password" autocomplete="current-password" required placeholder="Tu contraseña">
          <button type="button" class="pw-toggle" data-ver="password" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <div class="auth-check">
          <input type="checkbox" id="recordar">
          <label for="recordar">Recordarme en este dispositivo</label>
        </div>

        <button type="submit" id="btn-enviar" class="btn-aero-action">Ingresar</button>
      </form>

      <div class="auth-links">
        <a href="recuperar.html">¿Te olvidaste tu contraseña?</a><br>
        ¿No tenés cuenta? <a href="registro.html">Registrate</a>
      </div>
    </div>
  </main>

  <script src="idioma.js"></script>
  <script src="auth.js"></script>
</body>
</html>
