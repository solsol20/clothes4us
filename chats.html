<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="/img/clothes4uslogosinfondo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chats - Clothes4Us</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body data-page="chats">

  <header class="top-header">
    <div class="logo-section">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
        <img src="img/clothes4uslogosinfondo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Clothes4Us</h1>
      </a>
    </div>

    <div class="search-bar" data-buscar="usuarios">
      <input type="text" placeholder="Buscar usuarios..." aria-label="Buscar">
      <button type="button" data-ico="lupa" aria-label="Buscar usuarios"></button>
    </div>

    <div class="user-quick-auth">
      <a href="login.html" class="btn-glass" data-ico="usuario">Iniciar Sesión / Registrarse</a>
    </div>
  </header>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html" data-ico="casa">Inicio</a></li>
      <li><a href="articulos.html" data-ico="marcador">Guardados</a></li>
      <li><a href="chats.html" class="active" data-ico="comentario">Chats</a></li>
      <li><a href="carrito.html" data-ico="carrito">Carrito</a></li>
      <li><a href="perfil.html" data-ico="usuario">Mi Perfil</a></li>
      <li><a href="donar.html" data-ico="corazon">Donar</a></li>
      <li><a href="ayuda.html" data-ico="ayuda">Ayuda</a></li>
    </ul>
  </nav>

  <main class="aero-wrapper">

    <div class="aero-panel" style="width:100%;">
      <h3>Centro de Mensajes</h3>
      <div class="chat-wrapper">

        <div class="chat-users-list">
          <div id="chatLista"><p style="color:#666;">Cargando conversaciones…</p></div>
        </div>

        <div class="chat-box-area">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
            <div>
              <button type="button" id="btnVolverLista" class="btn-react volver-lista">&larr; Chats</button>
              <strong id="chatTitulo">Seleccioná un chat</strong>
            </div>
            <div>
              <button type="button" id="btnChatDenunciar" class="btn-react btn-report-flag" style="display:inline-flex;" disabled data-ico="bandera">Denunciar</button>
              <button type="button" id="btnChatBloquear" class="btn-react" style="display:inline-flex; color:#cc0000;" disabled data-ico="prohibido">Bloquear</button>
            </div>
          </div>

          <div class="chat-history" id="chatHistorial" aria-live="polite">
            <p class="sin-datos" style="text-align:center; color:#888;">Aquí aparecerán los mensajes del chat.</p>
          </div>

          <button type="button" id="chatContexto" class="chat-contexto" hidden></button>
          <img id="chatFotoPreview" class="chat-foto-preview" alt="Foto lista para enviar (tocala para quitarla)" hidden>
          <div id="chatEmojis" class="chat-emojis" hidden></div>
          <textarea id="chatTexto" maxlength="1000" placeholder="Escribí un mensaje..." aria-label="Mensaje" style="height:50px; margin-bottom:5px;"></textarea>
          <input type="file" id="chatArchivo" accept="image/*" hidden>
          <div style="display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap;">
            <div style="display:flex; gap:6px;">
              <button type="button" id="btnFotoChat" class="btn-react" data-ico="camara">Foto</button>
              <button type="button" id="btnEmoji" class="btn-react" data-ico="carita">Emoji</button>
            </div>
            <button type="button" id="btnEnviar" class="btn-aero-action" style="width:auto; margin:0;">Enviar Mensaje</button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script src="idioma.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
