<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="/img/clothes4uslogosinfondo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Clothes4Us</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
  <script src="tiempo-real.js"></script>
<body data-page="recuperar">

  <header class="top-header">
    <div class="logo-section">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
        <img src="img/clothes4uslogosinfondo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Clothes4Us</h1>
      </a>
    </div>
  </header>

  <main class="aero-wrapper auth-wrapper">
    <div class="aero-panel auth-panel">
      <h3>¿Olvidaste tu contraseña?</h3>
      <p class="auth-sub">Ingresá el correo o el teléfono con el que te registraste y te enviamos un código de 6 números para crear una contraseña nueva.</p>

      <div id="alerta" class="auth-alert" role="alert" aria-live="assertive"></div>

      <form id="form-recuperar" novalidate>
        <label for="contacto">Correo o teléfono:</label>
        <input type="text" id="contacto" autocomplete="email" autocapitalize="none" autocorrect="off"
               spellcheck="false" required placeholder="Tu correo o teléfono registrado" aria-describedby="ayuda-contacto">
        <p id="ayuda-contacto" class="auth-msg">Escribilo igual que cuando te registraste.</p>

        <button type="submit" id="btn-enviar" class="btn-aero-action">Enviar código</button>
      </form>

      <div class="auth-links">
        <a href="login.html">&larr; Volver a iniciar sesión</a>
      </div>
    </div>
  </main>

  <script src="idioma.js"></script>
  <script src="auth.js"></script>
</body>
</html>
