<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Clothes4Us</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body data-page="carrito">

  <header class="top-header">
    <div class="logo-section">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
        <img src="img/clothes4uslogosinfondo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <h1>Clothes4Us</h1>
      </a>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Buscar buzos, pantalones, usuarios..." aria-label="Buscar">
      <button type="button">Buscar</button>
    </div>

    <div class="user-quick-auth">
      <a href="login.html" class="btn-glass" data-ico="usuario">Iniciar Sesión / Registrarse</a>
    </div>
  </header>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html" data-ico="casa">Inicio</a></li>
      <li><a href="articulos.html" data-ico="marcador">Guardados</a></li>
      <li><a href="chats.html" data-ico="comentario">Chats</a></li>
      <li><a href="carrito.html" class="active" data-ico="carrito">Carrito</a></li>
      <li><a href="perfil.html" data-ico="usuario">Mi Perfil</a></li>
      <li><a href="donar.html" data-ico="corazon">Donar</a></li>
      <li><a href="ayuda.html" data-ico="ayuda">Ayuda</a></li>
    </ul>
  </nav>

  <main class="aero-wrapper">
    <section style="flex: 1;">
      <div class="aero-panel">
        <h3 data-ico="carrito">Mi Carrito</h3>
        <p style="margin-bottom: 15px; color: #333;">Clothes4Us conecta a compradores y vendedores: elegí tus prendas y coordiná el pago y la entrega por chat con cada vendedor.</p>
        <div id="listaCarrito"></div>
        <div id="resumenCarrito" class="carrito-resumen" hidden>
          <div><strong>Total estimado:</strong> <span id="totalCarrito" class="post-precio"></span></div>
          <button type="button" id="btnVaciar" class="btn-react btn-report-flag" style="margin-left:0;" data-ico="papelera">Vaciar carrito</button>
        </div>
      </div>
    </section>
  </main>

  <script src="idioma.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
